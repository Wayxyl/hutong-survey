<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="胡同更新利义平衡与ESG线上问卷">
<title>胡同更新与ESG调查问卷</title>
<style>
  :root {
    --primary: #b4552d;       /* 砖红 */
    --primary-dark: #8f3f1e;
    --bg: #f7f3ee;            /* 米灰 */
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #8a8177;
    --border: #e8e0d6;
    --selected: #fdf0e9;
    --ok: #3d8b5f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.6;
  }

  /* 顶部进度条 */
  .progress-wrap {
    position: sticky; top: 0; z-index: 100;
    background: rgba(247,243,238,.92);
    backdrop-filter: blur(8px);
    padding: 10px 16px calc(10px);
    border-bottom: 1px solid var(--border);
  }
  .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--primary); border-radius: 3px; transition: width .3s; }

  .container { max-width: 640px; margin: 0 auto; padding: 16px 16px 120px; }

  /* 问卷头 */
  .survey-head { text-align: center; padding: 20px 8px 8px; }
  .survey-head h1 { font-size: 22px; line-height: 1.4; color: var(--primary-dark); }
  .survey-head .sub { font-size: 14px; color: var(--muted); margin-top: 10px; }
  .notice {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 13px; color: var(--muted); margin: 16px 0 8px; text-align: left;
  }

  /* 分组标题 */
  .section-title {
    margin: 28px 4px 12px; font-size: 15px; font-weight: 600; color: var(--primary);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* 题目卡片 */
  .q-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 16px; margin-bottom: 14px;
  }
  .q-title { font-size: 16.5px; font-weight: 600; line-height: 1.5; }
  .q-title .q-no { color: var(--primary); margin-right: 4px; }
  .q-hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .q-note { font-size: 13.5px; color: var(--muted); margin-top: 6px; line-height: 1.6; }

  .options { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px;
    cursor: pointer; user-select: none; transition: all .15s; font-size: 15.5px; line-height: 1.5;
    min-height: 48px; /* 触控友好 */
  }
  .opt:active { transform: scale(.985); }
  .opt .mark {
    flex: none; width: 20px; height: 20px; margin-top: 2px;
    border: 2px solid #c9beb0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: transparent; transition: all .15s;
  }
  .opt.multi .mark { border-radius: 6px; }
  .opt.selected { border-color: var(--primary); background: var(--selected); }
  .opt.selected .mark { border-color: var(--primary); background: var(--primary); color: #fff; }
  .opt.disabled { opacity: .45; pointer-events: none; }
  .opt .content { flex: 1; }
  .opt .tag-other { display:inline-block; font-size: 11px; color: var(--primary); border: 1px solid var(--primary); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px;}

  .other-input {
    margin-top: 10px; width: 100%;
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 15px; font-family: inherit;
    background: #fbf9f6; color: var(--text);
  }
  .other-input:focus { outline: none; border-color: var(--primary); }

  /* 底部提交区 */
  .submit-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    background: rgba(247,243,238,.95); backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .submit-inner { max-width: 640px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
  .btn-submit {
    flex: 1; border: none; border-radius: 12px;
    background: var(--primary); color: #fff;
    font-size: 17px; font-weight: 600; font-family: inherit;
    padding: 14px 0; cursor: pointer; transition: background .2s;
  }
  .btn-submit:disabled { background: #d8cfc4; cursor: not-allowed; }
  .submit-tip { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }

  .err-flash { animation: shake .4s; border-color: #d9482b !important; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  /* 完成页 */
  .done-page { display: none; text-align: center; padding-top: 80px; }
  .done-page .icon { font-size: 56px; }
  .done-page h2 { margin: 16px 0 8px; color: var(--primary-dark); }
  .done-page p { color: var(--muted); font-size: 14px; padding: 0 24px; }
  .done-page .btn {
    display: inline-block; margin-top: 24px; padding: 12px 32px;
    background: var(--primary); color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-family: inherit; cursor: pointer;
  }
</style>
</head>
<body>

<div class="progress-wrap" id="progressWrap" style="display:none">
  <div class="progress-info"><span id="progressText">已答 0 / 22</span><span>胡同更新调查</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="container" id="formPage">
  <div class="survey-head">
    <h1>胡同更新：利义平衡与 ESG<br>认知调查问卷</h1>
    <div class="sub">预计用时 5–8 分钟 · 匿名填写</div>
  </div>

  <div class="notice">
    本问卷用于了解大家对胡同更新、商户经营与 ESG(环境、社会、治理)的看法。
    问卷采取<b>匿名</b>方式，不会收集您的姓名、电话等个人信息，数据仅用于研究分析。感谢您的参与！
  </div>

  <div id="questions"></div>
</div>

<div class="submit-bar" id="submitBar" style="display:none">
  <div class="submit-inner">
    <button class="btn-submit" id="btnSubmit">提交问卷</button>
  </div>
  <div class="submit-tip" id="submitTip">请完成全部题目后提交</div>
</div>

<div class="container done-page" id="donePage">
  <div class="icon">🎉</div>
  <h2>提交成功，感谢参与！</h2>
  <p>您的回答已记录。祝您生活愉快！</p>
  <button class="btn" onclick="location.reload()">再填一份</button>
</div>

<script>
/* ============ 题库数据 ============ */
const QUESTIONS = [
  { sec: "第一部分 · 基本信息" },
  { no:1,  type:"single", title:"您的年龄属于哪一组？", options:["18岁以下","18–29岁","30–44岁","45–59岁","60–74岁","75岁及以上","不愿说明"] },
  { no:2,  type:"single", title:"您目前的主要身份是？", options:["在校学生","企业、公司或机关事业单位员工","个体工商户、创业者或自由职业者","退休人员","暂无工作或其他","不愿说明"] },
  { no:3,  type:"single", title:"您与胡同的关系最接近哪一项？", options:["长期住在胡同或附近社区","在胡同工作、经营或提供服务","经常去胡同休闲、购物或参观","很少或没有去过胡同","其他或说不清"] },
  { no:4,  type:"single", title:"您平均多久去一次胡同？", options:["几乎每天","每周至少一次","每月至少一次","每年数次","很少或从未去过"] },
  { no:5,  type:"single", title:"您对“胡同更新”（如修房、改街道、引入商铺、增加绿地和公共设施）了解多少？", options:["完全不了解","听说过，但不太了解","了解一些","比较了解","非常了解"] },

  { sec: "第二部分 · 胡同更新的期待与担忧" },
  { no:6,  type:"multi", max:3, title:"您认为胡同更新最应该做到什么？", options:["保留老房子、老院子和历史记忆","改善居民住房、生活设施和日常便利","增加就业，支持小店经营","增加绿地、步道和休息空间","改善交通、停车和消防安全","让居民更多参与社区事务","其他"] },
  { no:7,  type:"multi", max:3, title:"您最希望胡同里出现哪些类型的商户？", options:["菜店、药店、维修店等生活服务","本地小吃店、传统手艺店","书店、咖啡店、社区文化空间","文化创意小店、手工体验店","民宿、短租空间","连锁餐饮店、品牌商店","工作室、共享办公空间","其他"] },
  { no:8,  type:"multi", max:3, title:"哪些商户经营带来的影响，是您最不能接受的？", options:["夜里太吵，影响居民休息","房租上涨，原住民或小商户被迫搬走","垃圾、油烟、噪声或货车占道","改动院墙、门窗、砖木结构，破坏老胡同的样子","便宜的生活服务被高价旅游消费取代","店铺越来越像，缺少本地特色","挤占居民走路、休息和活动的空间","其他"] },

  { sec: "第三部分 · 商户经营与成本分担" },
  { no:9,  type:"single", title:"一家临街老院落小店装修后，租金明显上涨。您认为商户怎样做最合理？", options:["适当提高商品或服务价格，逐步收回装修成本","保留必要的文化特色，价格小幅上涨，同时继续服务居民","优先挣钱，减少文化保护和社区服务投入","如果赚不到钱就退出，把房子租给愿意出高价的人","由商户、房东、政府和居民一起商量成本和收益怎么分担","说不清，要看具体情况"] },
  { no:10, type:"single", title:"如果一家商户因为保护老建筑、减少污染或服务居民而增加成本，您最多愿意为同类商品或服务多付多少钱？", options:["不愿意多付","5%以内","6%–10%","11%–20%","20%以上","要看具体服务是否可信"] },
  { no:11, type:"multi", max:3, title:"如果保护文化和服务居民增加了经营成本，您认为应该由谁一起分担？", options:["商户自己承担，通过提高产品和服务质量来消化","房东少收一点租金","政府给补贴、减税或低息贷款","消费者接受合理涨价","社区基金或商户互助组织提供支持","不应该增加这些成本，应少做相关项目","说不清"] },
  { no:12, type:"multi", max:3, title:"您认为胡同商户还应对社区承担哪些责任？", options:["保护老建筑、老院子和胡同文化","少影响居民休息和日常生活","做好垃圾分类，减少油烟和噪声","为附近居民提供方便、价格合理的生活服务","招聘和善待员工，尽量使用本地劳动力","公开经营信息，认真处理投诉","说不清，商户只要合法经营就可以"] },

  { sec: "第四部分 · ESG 认知与期待" },
  { no:13, type:"single", title:"您是否听说过“ESG”？", note:"E：环境，主要指节能、垃圾分类、减少污染；S：社会，主要指保护文化、服务居民、善待员工；G：治理，主要指信息公开、投诉处理和规范经营。", options:["完全没听说过","听说过，但不了解","大致了解","比较了解","非常了解"] },
  { no:14, type:"multi", max:3, title:"您最看重哪些环境（E）做法？", options:["节约用水用电","做好垃圾分类，减少一次性用品","减少油烟、噪声和装修污染","减少货车进出和运输带来的拥堵","少浪费装修材料，尽量重复利用","增加绿植，减少地面硬化","不太关注"] },
  { no:15, type:"multi", max:3, title:"您最看重哪些社会责任（S）做法？", options:["保护老建筑、老院子和胡同文化","不打扰居民休息，保持门前和通道整洁","为老人、儿童和行动不便者提供方便","提供价格合理、居民日常需要的商品和服务","善待员工，按时发工资，保障休息","招聘本地居民，支持社区活动","不太关注"] },
  { no:16, type:"multi", max:3, title:"您最看重哪些治理（G）做法？", options:["明码标价，按规定经营","公开卫生、消防、环保等检查信息","对居民投诉及时回应，并说明处理结果","涉及装修、外摆、营业时间时，先和居民商量","加入商户自律组织，接受同行监督","请独立第三方定期评价","不太关注"] },
  { no:17, type:"multi", max:3, title:"您认为小商户做好环境（E）、社会（S）和治理（G）工作的主要困难是什么？", options:["改造和日常运营成本太高","不知道具体该怎么做，缺少简单好用的办法","店里人少，没有时间记录和管理","租期短，担心投入后收不回来","顾客和居民不愿为这些投入多付钱","担心被说成“只做表面功夫”","缺少政策支持和稳定预期","说不清"] },
  { no:18, type:"multi", max:3, title:"判断一家商户是否真正负责任，您最相信哪些信息？", options:["自己到店看到的卫生、环境和服务","居民、朋友或邻居的评价","商户公开的承诺和整改记录","政府或社区公布的检查结果","新闻媒体或网络平台的评价","第三方机构或行业组织的评价","说不清"] },
  { no:19, type:"multi", max:3, title:"如果一家商户兼顾文化保护、居民生活和环境责任，您愿意怎样支持它？", options:["优先去消费，推荐给别人","接受合理范围内的涨价","参加社区活动或志愿服务","把居民意见反馈给商户","参加公开评议或监督","目前不愿参与","说不清"] },
  { no:20, type:"multi", max:3, title:"您认为哪些办法有助于居民参与监督？", options:["商户公开服务承诺和处理结果","居民代表参加商户入驻和改造评审","政府或社区定期公布检查与整改情况","建立方便好用的投诉和反馈渠道","商户之间互相评议、自我管理","请独立第三方定期评价","说不清"] },

  { sec: "第五部分 · 总体看法" },
  { no:21, type:"single", title:"总体来看，您认为胡同更新中“商户赚钱”和“保护文化、照顾居民”可以兼顾吗？", options:["完全可以兼顾","多数情况下可以兼顾","要看具体项目","比较难兼顾","很难兼顾","说不清"] },
  { no:22, type:"single", title:"您是否同意“胡同商户入驻或改造前，应先听取居民意见”？", options:["非常同意","比较同意","一般","不太同意","很不同意","说不清"] },
];

/* ============ 渲染 ============ */
const LETTERS = "ABCDEFGH";
const answers = {};   // { no: {choices:[], other:""} }
const qRoots = {};    // no -> 卡片DOM

function render() {
  const box = document.getElementById("questions");
  let html = "";
  for (const q of QUESTIONS) {
    if (q.sec) { html += `<div class="section-title">${q.sec}</div>`; continue; }
    const isMulti = q.type === "multi";
    const hasOther = q.options[q.options.length-1] === "其他";
    html += `
    <div class="q-card" id="q${q.no}">
      <div class="q-title"><span class="q-no">${q.no}.</span>${q.title}</div>
      <div class="q-hint">${isMulti ? `多选 · 最多选 ${q.max} 项` : "单选"}</div>
      ${q.note ? `<div class="q-note">${q.note}</div>` : ""}
      <div class="options">
        ${q.options.map((o,i)=>`
          <div class="opt ${isMulti?"multi":""}" data-no="${q.no}" data-idx="${i}">
            <div class="mark">${isMulti?"✓":"●"}</div>
            <div class="content">${o}${(hasOther && i===q.options.length-1)?'<span class="tag-other">请填写</span>':""}</div>
          </div>`).join("")}
      </div>
      ${hasOther ? `<input class="other-input" id="other${q.no}" placeholder="请填写其他想法（选填）" style="display:none">` : ""}
    </div>`;
  }
  box.innerHTML = html;

  // 事件绑定
  for (const q of QUESTIONS) {
    if (!q.no) continue;
    answers[q.no] = { choices: [], other: "" };
    qRoots[q.no] = document.getElementById("q" + q.no);
    document.querySelectorAll(`.opt[data-no="${q.no}"]`).forEach(el => {
      el.addEventListener("click", () => toggle(q, parseInt(el.dataset.idx), el));
    });
    const otherInput = document.getElementById("other" + q.no);
    if (otherInput) otherInput.addEventListener("input", e => { answers[q.no].other = e.target.value.trim(); updateProgress(); });
  }
}

function toggle(q, idx, el) {
  const a = answers[q.no];
  const isMulti = q.type === "multi";
  if (isMulti) {
    const pos = a.choices.indexOf(idx);
    if (pos >= 0) { a.choices.splice(pos, 1); el.classList.remove("selected"); }
    else {
      if (a.choices.length >= q.max) { flash(el); return; }
      a.choices.push(idx); el.classList.add("selected");
    }
    // 达到上限后禁用未选项
    document.querySelectorAll(`.opt[data-no="${q.no}"]`).forEach(o => {
      const i = parseInt(o.dataset.idx);
      if (!a.choices.includes(i)) o.classList.toggle("disabled", a.choices.length >= q.max);
      else o.classList.remove("disabled");
    });
    // 显示/隐藏 其他 输入框
    const otherInput = document.getElementById("other" + q.no);
    if (otherInput) {
      const isOther = q.options[q.options.length-1] === "其他" && a.choices.includes(q.options.length-1);
      otherInput.style.display = isOther ? "block" : "none";
      if (!isOther) { otherInput.value = ""; a.other = ""; }
    }
  } else {
    a.choices = [idx];
    document.querySelectorAll(`.opt[data-no="${q.no}"]`).forEach(o =>
      o.classList.toggle("selected", parseInt(o.dataset.idx) === idx));
  }
  updateProgress();
}

function flash(el) { el.classList.remove("err-flash"); void el.offsetWidth; el.classList.add("err-flash"); }

/* ============ 进度 ============ */
function updateProgress() {
  const done = QUESTIONS.filter(q => q.no && answers[q.no].choices.length > 0).length;
  const total = QUESTIONS.filter(q => q.no).length;
  document.getElementById("progressText").textContent = `已答 ${done} / ${total}`;
  document.getElementById("progressFill").style.width = (done / total * 100) + "%";
  const btn = document.getElementById("btnSubmit");
  btn.disabled = done < total;
  document.getElementById("submitTip").textContent = done < total ? `还有 ${total - done} 题未完成` : "全部完成，感谢您的耐心填写！";
}

/* ============ 提交 ============ */
document.getElementById("btnSubmit").addEventListener("click", async () => {
  // 校验
  for (const q of QUESTIONS) {
    if (!q.no) continue;
    if (answers[q.no].choices.length === 0) {
      qRoots[q.no].scrollIntoView({ behavior: "smooth", block: "center" });
      flash(qRoots[q.no]);
      return;
    }
  }
  // 组装数据
  const payload = {
    submittedAt: new Date().toISOString(),
    answers: QUESTIONS.filter(q => q.no).map(q => ({
      no: q.no,
      choices: answers[q.no].choices.map(i => LETTERS[i]),
      other: answers[q.no].other || undefined
    }))
  };
  // 上传到 Cloudflare Worker(自动写入 GitHub 仓库 data/ 目录)
  const API_BASE = "https://survey.wayxyl.icu";
  try {
    const res = await fetch(API_BASE + "/record", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data || !data.ok) console.warn("上传失败:", data);
  } catch (e) { console.warn("网络上传失败", e); }
  // 本地留一份备份
  try {
    const list = JSON.parse(localStorage.getItem("survey_responses") || "[]");
    list.push(payload);
    localStorage.setItem("survey_responses", JSON.stringify(list));
  } catch (e) { console.warn("本地保存失败", e); }

  document.getElementById("formPage").style.display = "none";
  document.getElementById("submitBar").style.display = "none";
  document.getElementById("progressWrap").style.display = "none";
  document.getElementById("donePage").style.display = "block";
  window.scrollTo(0, 0);
});

render();
document.getElementById("progressWrap").style.display = "block";
document.getElementById("submitBar").style.display = "block";
updateProgress();
</script>
</body>
</html>
